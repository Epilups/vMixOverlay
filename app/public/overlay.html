<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard overlay</title>
<link rel="preload" href="/fonts/IronMan.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Self-hosted: the overlay must not wait on a CDN mid-game. Regular is the
     only weight shipped, so every rule asks for 400 — a heavier request would
     get a synthesised bold that smears this face. font-display:block hides the
     text for a beat rather than flashing it in the fallback. */
  @font-face{font-family:'IronMan';font-style:normal;font-weight:400;font-display:block;
             src:url('/fonts/IronMan.ttf') format('truetype')}
  /* Corner bug (design 3c): anchored top-left, teams stacked vertically,
     penalties extend to the RIGHT of each team's row. Slot 1 sits nearest the
     box; when it expires slot 2 slides left into its place. */
  :root{
    --panel:rgba(24,26,31,.94); --clock-bg:#0b0c0f; --pen-accent:#e4574a;
    --row-h:47px; --team-w:158px; --score-w:52px; --logo-w:30px;
    --clock-w:96px; --pen-w:84px; --gap:2px;
    --pens-w:172px; /* maxPenalties * SLOT, kept in sync from paint() */
    --margin-top:48px; --margin-left:48px;
    --face:"IronMan","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
  body{font:400 16px var(--face);-webkit-font-smoothing:antialiased}
  /* ?bg=1 for previewing outside vMix */
  body.bg{background:#15161a repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px)}

  #wrap{position:absolute;top:var(--margin-top);left:var(--margin-left);display:flex;align-items:stretch;
        filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));
        transform:translateX(calc(-100% - var(--margin-left)));transition:transform .55s cubic-bezier(.16,1,.3,1)}
  body.on #wrap{transform:translateX(0)}

  #clock{width:var(--clock-w);background:var(--clock-bg);border-radius:5px 0 0 5px;
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
  #clock .t{font:400 39px/1 var(--face);color:#fff}
  #clock.stopped .t{color:#9aa0a8}
  /* IronMan has proportional figures only (a 1 is 70% the width of a 0) and
     no tnum feature, so centred times would shuffle sideways every second.
     setTime() gives each digit a cell as wide as the widest figure instead. */
  .t i,.tm i{display:inline-block;width:.45em;text-align:center;font-style:normal}
  .t i.c,.tm i.c{width:.24em}
  #clock .p{display:flex;gap:4px}
  #clock .p i{width:14px;height:3px;background:rgba(255,255,255,.22)}
  #clock .p i.on{background:#fff}

  #teams{display:flex;flex-direction:column;gap:var(--gap)}
  .row{display:flex;align-items:stretch}
  .team{width:var(--team-w);height:var(--row-h);background:var(--panel);display:flex;align-items:center;
        padding-left:12px;gap:8px}
  .team .logo{width:var(--logo-w);height:var(--logo-w);flex:none;display:none}
  .team.has .logo{display:block;object-fit:contain}
  /* Right-aligned so the abbreviation always ends one gap short of the score.
     Codes vary in width (TIT 37px, HAW 52px) and the logo may be absent, and
     left-aligning would dump all of that slack between the name and the score. */
  .team .short{flex:1;text-align:right;font-size:29px;letter-spacing:.09em;color:#eceef1;
               text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .team .score{width:var(--score-w);align-self:stretch;background:var(--accent,#2a63b8);display:flex;align-items:center;
               justify-content:center;font:400 34px/1 var(--face);color:#fff}
  .team .score .n{display:block;transition:transform .28s cubic-bezier(.2,1.6,.3,1)}
  .team.pop .score .n{transform:scale(1.26)}

  /* Penalty track: rows are placed absolutely by slot index, so the track only
     needs to reserve the slots' footprint. It has no background of its own, so
     reserving the full width costs nothing visually — but it does put the
     penalties inside #wrap's measured width, which is what the hide transform
     translates by. With width:0 they hung outside the box and stayed on screen
     after the bar slid off. */
  .pens{position:relative;width:var(--pens-w);height:var(--row-h)}
  .pen{position:absolute;top:0;left:0;width:var(--pen-w);height:var(--row-h);background:var(--panel);
        overflow:hidden;display:flex;align-items:center;justify-content:center;
        transition:left .34s cubic-bezier(.16,1,.3,1);
        animation:penIn .42s cubic-bezier(.16,1,.3,1) both;transform-origin:left center}
  .pen.out{animation:penOut .3s ease-in forwards}
  .pen .tm{font:400 30px/1 var(--face);color:#fff;position:relative}
  .pen .fill{position:absolute;bottom:0;left:0;height:3px;width:100%;background:var(--pen-accent);transform-origin:left}
  .pen.ending .tm{animation:penFlash .8s steps(1,end) infinite}
  @keyframes penIn{from{opacity:0;transform:scaleX(.3)}to{opacity:1;transform:none}}
  @keyframes penOut{to{opacity:0;transform:scaleX(.3);filter:brightness(1.7)}}
  @keyframes penFlash{0%,50%{color:#fff}50.01%,100%{color:var(--pen-accent)}}
</style>
</head>
<body>
<div id="wrap">
  <div id="clock"><div class="t">20:00</div><div class="p"></div></div>
  <div id="teams">
    <div class="row">
      <div class="team" id="teamHome"><img class="logo" alt=""><span class="short">HAW</span><span class="score"><span class="n">0</span></span></div>
      <div class="pens" id="penHome"></div>
    </div>
    <div class="row">
      <div class="team" id="teamAway"><img class="logo" alt=""><span class="short">TIT</span><span class="score"><span class="n">0</span></span></div>
      <div class="pens" id="penAway"></div>
    </div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
if (qs.get('bg') === '1') document.body.classList.add('bg');

const el = (id) => document.getElementById(id);
const cap = (s) => s[0].toUpperCase() + s.slice(1);
// Time remaining rounds up, so a full 2:00 shows for its whole first second;
// elapsed time rounds down, so it only reads 0:01 once a second has actually passed.
const fmt = (ms, { elapsed = false, pad = false } = {}) => {
  const t = elapsed ? Math.floor(ms / 1000) : Math.ceil(ms / 1000);
  const m = String(Math.floor(t / 60));
  return (pad ? m.padStart(2, '0') : m) + ':' + String(t % 60).padStart(2, '0');
};
// Rebuilds the digit cells only when the text changes, not on every tick.
const setTime = (node, str) => {
  if (node.dataset.v === str) return;
  node.dataset.v = str;
  node.innerHTML = [...str].map((ch) => ch === ':' ? '<i class="c">:</i>' : '<i>' + ch + '</i>').join('');
};
const prev = { home: 0, away: 0 };
const nodes = { home: new Map(), away: new Map() };
const SLOT = 86; // penalty width 84 + 2 gap

function paintTeam(side, t, max) {
  const team = el('team' + cap(side));
  if (t.score !== prev[side]) {
    team.querySelector('.score .n').textContent = t.score;
    team.classList.add('pop');
    setTimeout(() => team.classList.remove('pop'), 300);
    prev[side] = t.score;
  }
  const short = team.querySelector('.short');
  if (short.textContent !== t.short) short.textContent = t.short;
  team.style.setProperty('--accent', t.color);

  const img = team.querySelector('.logo');
  if (t.logo && img.dataset.src !== t.logo) {
    img.dataset.src = t.logo;
    img.onload = () => team.classList.add('has');
    img.onerror = () => team.classList.remove('has');
    img.src = t.logo;
  }
  if (!t.logo) team.classList.remove('has');

  // penalties: index = slot. Only the first `max` are drawn (rest are queued
  // server-side); cells are positioned by slot so a promotion slides left.
  const track = el('pen' + cap(side));
  const active = t.penalties.slice(0, max);
  const seen = new Set();
  active.forEach((p, i) => {
    seen.add(p.id);
    let n = nodes[side].get(p.id);
    if (!n) {
      n = document.createElement('div');
      n.className = 'pen';
      n.innerHTML = '<span class="tm"></span><div class="fill"></div>';
      track.appendChild(n);
      nodes[side].set(p.id, n);
    }
    n.style.left = (i * SLOT) + 'px';
    setTime(n.querySelector('.tm'), fmt(p.msLeft));
    n.querySelector('.fill').style.transform = 'scaleX(' + (p.msLeft / p.msTotal).toFixed(3) + ')';
    n.classList.toggle('ending', p.msLeft <= 10000);
  });
  for (const [id, n] of nodes[side]) {
    if (!seen.has(id) && !n.classList.contains('out')) {
      n.classList.add('out');
      nodes[side].delete(id);
      setTimeout(() => n.remove(), 300);
    }
  }
}

function paint(s) {
  document.body.classList.toggle('on', !!s.visible);
  document.documentElement.style.setProperty('--pens-w', (s.maxPenalties * SLOT) + 'px');
  const c = el('clock');
  setTime(c.querySelector('.t'), fmt(s.clock.ms, { elapsed: s.countUp, pad: true }));
  c.classList.toggle('stopped', !s.clock.running);
  const dots = c.querySelector('.p');
  const total = Math.max(3, s.period);
  if (dots.childElementCount !== total) {
    dots.innerHTML = '';
    for (let i = 0; i < total; i++) dots.appendChild(document.createElement('i'));
  }
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i < s.period));
  paintTeam('home', s.home, s.maxPenalties);
  paintTeam('away', s.away, s.maxPenalties);
}

function connect() {
  const es = new EventSource('/events');
  es.onmessage = (e) => paint(JSON.parse(e.data));
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}

/* ?demo=1 — self-contained preview: ticks a fake game locally instead of
   subscribing, so server state can't overwrite it. */
if (qs.get('demo') === '1') {
  const demo = {
    visible: true, period: 2, maxPenalties: 2,
    clock: { ms: 12 * 60000 + 47000, running: true },
    home: { name: 'Ķekava', short: 'ĶEK', color: '#2a63b8', logo: 'logos/kekava.png', score: 3,
      penalties: [{ id: 1, label: '2 min', msTotal: 120000, msLeft: 102000 },
                  { id: 2, label: '2 min', msTotal: 120000, msLeft: 23000 }] },
    away: { name: 'Ulbroka', short: 'ULB', color: '#b23a2e', logo: 'logos/ulbroka.png', score: 2,
      penalties: [{ id: 3, label: '4 min', msTotal: 240000, msLeft: 240000 }] },
  };
  setInterval(() => {
    demo.clock.ms = Math.max(0, demo.clock.ms - 100);
    for (const s of ['home', 'away']) {
      demo[s].penalties.forEach((p) => { p.msLeft = Math.max(0, p.msLeft - 100); });
      demo[s].penalties = demo[s].penalties.filter((p) => p.msLeft > 0);
    }
    paint(demo);
  }, 100);
} else {
  connect();
}
</script>
</body>
</html>
